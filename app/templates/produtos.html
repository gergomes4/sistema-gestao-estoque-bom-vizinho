
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Bom Vizinho</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            color: #222;
            margin: 0;
            padding: 25px;
        }

        header {
            background: #176b3a;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }

        main {
            max-width: 900px;
            margin: 25px auto;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #176b3a;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 18px;
        }

        a {
            color: #176b3a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #e5f1e8;
        }

        :focus-visible {
            outline: 3px solid #e09b00;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Mercadinho Bom Vizinho</h1>
        <p>Sistema de Gestão de Estoque</p>
    </header>

    <main>
        <p><a href="/">Voltar à página inicial</a></p>

        <section>
            <h2>Cadastro de Produtos</h2>

            <form>
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite o nome do produto">

                <label for="categoria">Categoria</label>
                <input type="text" id="categoria" name="categoria"
                       placeholder="Ex.: Alimentos">

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" name="quantidade"
                       min="0">

                <label for="validade">Data de validade</label>
                <input type="date" id="validade" name="validade">

                <button type="button">Cadastrar produto</button>
            </form>
        </section>

        <section>
            <h2>Produtos cadastrados</h2>

            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Quantidade</th>
                        <th>Validade</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4">Nenhum produto cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
